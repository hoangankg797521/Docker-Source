name: WireGuard custom images
on:
  push:
    branches: [main]
    paths: ['wireguard/**', '.github/workflows/wireguard-images.yml']
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: wireguard-images-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sh wireguard/scripts/test.sh
  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {context: wg-easy, image: wg-easy}
          - {context: noc-dashboard, image: wg-noc}
          - {context: acl, image: wg-acl}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: wireguard/${{ matrix.context }}
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/hoangankg797521/${{ matrix.image }}:1.0.0
            ghcr.io/hoangankg797521/${{ matrix.image }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/hoangankg797521/Docker-Source
            org.opencontainers.image.licenses=AGPL-3.0-only
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
