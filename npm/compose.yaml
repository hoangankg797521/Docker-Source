name: npm
services:
  npm:
    build: .
    image: local/npm:2.15.1-ddns.2
    container_name: nginx-proxy-manager
    restart: unless-stopped
    ports:
      - "80:80"
      - "81:81"
      - "443:443"
    environment:
      TZ: Asia/Ho_Chi_Minh
      DDNS_RESOLVERS: '8.8.8.8,1.1.1.1'
    volumes:
      - ./data:/data
      - ./letsencrypt:/etc/letsencrypt
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
